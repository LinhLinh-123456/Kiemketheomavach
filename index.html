<!DOCTYPE html>lk
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kiểm kê bằng mã hàng</title>

  <!-- Đọc file Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Quét mã bằng camera -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 10px 0 20px;
    }

    .card {
      background: #fff;
      padding: 16px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="file"],
    input[type="text"] {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #1677ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:active { opacity: .8; }

    .green { background: #198754; }
    .red { background: #dc3545; }

    #reader {
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      display: block;
      background: #f8d7da;
      color: #842029;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: #eef3f8;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }

    .number {
      font-size: 25px;
      font-weight: bold;
      color: #1677ff;
      display: block;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px;
      border: 1px solid #ddd;
      white-space: nowrap;
    }

    th {
      background: #1677ff;
      color: white;
    }

    .hint {
      color: #666;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📦 KIỂM KÊ BẰNG MÃ HÀNG</h1>

  <div class="card">
    <label>1. Tải file Excel kiểm kê</label>

    <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">

    <div class="hint">
      File cần có các cột: Số thứ tự, Mã hàng, Vị trí,
      Quy cách, Số lượng 1, Số lượng 2, Kết quả.
    </div>

    <div id="fileMessage" class="message"></div>
  </div>

  <div class="card">
    <label>2. Quét hoặc nhập mã hàng</label>

    <input
      type="text"
      id="barcodeInput"
      placeholder="Nhập hoặc quét Mã hàng..."
      autocomplete="off"
    >

    <button class="green" onclick="checkCode()">
      🔍 Kiểm tra mã
    </button>

    <button onclick="startScanner()">
      📷 Mở camera để quét mã
    </button>

    <button
      id="stopButton"
      class="red"
      style="display:none"
      onclick="stopScanner()"
    >
      ⛔ Tắt camera
    </button>

    <div id="reader"></div>
    <div id="scanMessage" class="message"></div>
  </div>

  <div class="card">
    <label>3. Thống kê</label>

    <div class="stats">
      <div class="stat">
        <span class="number" id="productCount">0</span>
        Mã hàng trong file
      </div>

      <div class="stat">
        <span class="number" id="totalScans">0</span>
        Tổng lần quét
      </div>

      <div class="stat">
        <span class="number" id="checkedCount">0</span>
        Mã đã kiểm
      </div>

      <div class="stat">
        <span class="number" id="totalResult">0</span>
        Tổng kết quả
      </div>
    </div>
  </div>

  <div class="card">
    <label>4. Kết quả kiểm kê</label>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Mã hàng</th>
            <th>Vị trí</th>
            <th>Quy cách</th>
            <th>SL 1</th>
            <th>SL 2</th>
            <th>Lần quét</th>
            <th>Kết quả</th>
          </tr>
        </thead>

        <tbody id="tableBody">
          <tr>
            <td colspan="7" style="text-align:center">
              Hãy tải file Excel để bắt đầu.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <button class="red" onclick="resetData()">
      🗑️ Xóa kết quả kiểm kê
    </button>
  </div>

</div>

<script>

let products = [];
let scanner = null;
let scannerRunning = false;
let lastCode = "";
let lastTime = 0;


/* =========================
   ĐỌC FILE EXCEL
========================= */

document.getElementById("excelFile")
  .addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    try {

      const data = new Uint8Array(e.target.result);

      const workbook = XLSX.read(data, {
        type: "array"
      });

      const sheetName = workbook.SheetNames[0];

      const worksheet =
        workbook.Sheets[sheetName];

      const rows = XLSX.utils.sheet_to_json(
        worksheet,
        { defval: "" }
      );

      products = [];

      rows.forEach(function(row) {

        const code = getValue(row, [
          "Mã hàng",
          "Mã Hàng",
          "MA HANG",
          "Mã vạch",
          "Barcode"
        ]);

        if (!code) return;

        products.push({
          code: String(code).trim(),

          position: getValue(row, [
            "Vị trí",
            "Vị Trí",
            "Vị trí hàng"
          ]),

          specification: toNumber(
            getValue(row, [
              "Quy cách",
              "Quy Cách"
            ])
          ),

          quantity1: getValue(row, [
            "Số lượng 1",
            "Số Lượng 1"
          ]),

          quantity2: getValue(row, [
            "Số lượng 2",
            "Số Lượng 2"
          ]),

          scans: 0,

          result: toNumber(
            getValue(row, [
              "Kết quả",
              "Kết Quả"
            ])
          )
        });

      });

      showMessage(
        "fileMessage",
        "success",
        "✅ Đã tải thành công " +
        products.length +
        " mã hàng."
      );

      updateTable();
      updateStats();

    } catch(error) {

      console.error(error);

      showMessage(
        "fileMessage",
        "error",
        "❌ Không thể đọc file Excel. Hãy kiểm tra lại file."
      );
    }

  };

  reader.readAsArrayBuffer(file);

});


/* =========================
   LẤY GIÁ TRỊ CỘT
========================= */

function getValue(row, names) {

  const keys = Object.keys(row);

  for (let name of names) {

    const target = normalize(name);

    for (let key of keys) {

      if (normalize(key) === target) {
        return row[key];
      }

    }
  }

  return "";
}

function normalize(text) {
  return String(text)
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");
}


/* =========================
   KIỂM TRA MÃ
========================= */

function checkCode() {

  const input =
    document.getElementById("barcodeInput");

  const code = input.value.trim();

  if (!code) {

    showMessage(
      "scanMessage",
      "error",
      "⚠️ Hãy nhập hoặc quét mã hàng."
    );

    return;
  }

  processCode(code);

  input.value = "";
  input.focus();
}


document.getElementById("barcodeInput")
  .addEventListener("keydown", function(e) {

  if (e.key === "Enter") {
    checkCode();
  }

});


/* =========================
   XỬ LÝ MÃ QUÉT
========================= */

function processCode(code) {

  if (products.length === 0) {

    showMessage(
      "scanMessage",
      "error",
      "⚠️ Hãy tải file Excel trước."
    );

    return;
  }

  const cleanCode = String(code).trim();

  const product = products.find(function(item) {
    return item.code === cleanCode;
  });

  if (!product) {

    showMessage(
      "scanMessage",
      "error",
      "❌ Không tìm thấy mã: <b>" +
      escapeHtml(cleanCode) +
      "</b>"
    );

    return;
  }

  // Mỗi lần quét cộng thêm 1 lần
  product.scans += 1;

  // Mỗi lần quét cộng Quy cách vào Kết quả
  product.result += product.specification;

  showMessage(
    "scanMessage",
    "success",

    "✅ ĐÃ GHI NHẬN<br><br>" +

    "<b>Mã hàng:</b> " +
    escapeHtml(product.code) +

    "<br><b>Vị trí:</b> " +
    escapeHtml(product.position || "-") +

    "<br><b>Quy cách:</b> " +
    formatNumber(product.specification) +

    "<br><b>Đã quét:</b> " +
    product.scans +
    " lần" +

    "<br><br><b>KẾT QUẢ:</b><br>" +

    "<span style='font-size:30px;font-weight:bold'>" +
    formatNumber(product.result) +
    "</span>"
  );

  updateTable();
  updateStats();
}


/* =========================
   CAMERA
========================= */

async function startScanner() {

  if (scannerRunning) return;

  if (products.length === 0) {

    showMessage(
      "scanMessage",
      "error",
      "⚠️ Hãy tải file Excel trước khi mở camera."
    );

    return;
  }

  try {

    scanner = new Html5Qrcode("reader");

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 180
        }
      },

      function(decodedText) {

        const now = Date.now();

        // Chống quét liên tục cùng một mã
        if (
          decodedText === lastCode &&
          now - lastTime < 2000
        ) {
          return;
        }

        lastCode = decodedText;
        lastTime = now;

        processCode(decodedText);
      },

      function() {
        // Không xử lý lỗi từng khung hình
      }

    );

    scannerRunning = true;

    document.getElementById("stopButton")
      .style.display = "block";

  } catch(error) {

    console.error(error);

    showMessage(
      "scanMessage",
      "error",
      "❌ Không thể mở camera. Hãy cho phép Safari sử dụng camera."
    );
  }
}


async function stopScanner() {

  if (!scanner || !scannerRunning) return;

  try {

    await scanner.stop();
    await scanner.clear();

  } catch(error) {
    console.error(error);
  }

  scanner = null;
  scannerRunning = false;

  document.getElementById("reader")
    .innerHTML = "";

  document.getElementById("stopButton")
    .style.display = "none";
}


/* =========================
   CẬP NHẬT BẢNG
========================= */

function updateTable() {

  const body =
    document.getElementById("tableBody");

  body.innerHTML = "";

  if (products.length === 0) {

    body.innerHTML =
      "<tr><td colspan='7' style='text-align:center'>" +
      "Hãy tải file Excel để bắt đầu." +
      "</td></tr>";

    return;
  }

  products.forEach(function(product) {

    const row =
      document.createElement("tr");

    row.innerHTML =
      "<td>" + escapeHtml(product.code) + "</td>" +
      "<td>" + escapeHtml(product.position || "") + "</td>" +
      "<td>" + formatNumber(product.specification) + "</td>" +
      "<td>" + escapeHtml(product.quantity1) + "</td>" +
      "<td>" + escapeHtml(product.quantity2) + "</td>" +
      "<td>" + product.scans + "</td>" +
      "<td><b>" +
      formatNumber(product.result) +
      "</b></td>";

    body.appendChild(row);
  });
}


/* =========================
   THỐNG KÊ
========================= */

function updateStats() {

  let totalScans = 0;
  let checkedCount = 0;
  let totalResult = 0;

  products.forEach(function(product) {

    totalScans += product.scans;

    if (product.scans > 0) {
      checkedCount += 1;
    }

    totalResult += product.result;
  });

  document.getElementById("productCount")
    .textContent = products.length;

  document.getElementById("totalScans")
    .textContent = totalScans;

  document.getElementById("checkedCount")
    .textContent = checkedCount;

  document.getElementById("totalResult")
    .textContent = formatNumber(totalResult);
}


/* =========================
   XÓA KẾT QUẢ
========================= */

function resetData() {

  if (products.length === 0) return;

  if (!confirm("Bạn có chắc muốn xóa kết quả kiểm kê?")) {
    return;
  }

  products.forEach(function(product) {
    product.scans = 0;
    product.result = 0;
  });

  updateTable();
  updateStats();

  showMessage(
    "scanMessage",
    "success",
    "🗑️ Đã xóa kết quả kiểm kê."
  );
}


/* =========================
   HÀM HỖ TRỢ
========================= */

function toNumber(value) {

  if (
    value === "" ||
    value === null ||
    value === undefined
  ) {
    return 0;
  }

  if (typeof value === "number") {
    return value;
  }

  let text = String(value)
    .replace(/\./g, "")
    .replace(/,/g, "")
    .replace(/[^\d-]/g, "");

  return Number(text) || 0;
}


function formatNumber(number) {
  return Number(number || 0)
    .toLocaleString("vi-VN");
}


function showMessage(id, type, message) {

  const element =
    document.getElementById(id);

  element.className =
    "message " + type;

  element.innerHTML = message;
}


function escapeHtml(text) {

  return String(text === undefined ? "" : text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
